<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>物理掌中学</title>
<style>
:root{
  --blue:#2E86DE; --blue-bg:#eaf2ff;
  --mint:#14b8a6; --mint-bg:#e2f8f5;
  --purple:#8b5cf6; --purple-bg:#f1ebfe;
  --orange:#f59e0b; --orange-bg:#fef3e2;
  --text-2:#888;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333;font-size:14px;-webkit-tap-highlight-color:transparent}
.page{display:none;min-height:100vh;padding-bottom:64px}.page.active{display:block}
.topbar{background:linear-gradient(135deg,#2E86DE,#1a5fa8);color:#fff;padding:16px;position:sticky;top:0;z-index:10}
.topbar .title{font-size:17px;font-weight:700}
.topbar .subtitle{font-size:12px;opacity:.85;margin-top:2px}
.content{padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card.tight{padding:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-head .h{font-size:15px;font-weight:700}
.card-head .more{font-size:12px;color:#2E86DE;cursor:pointer}
.chapter{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.chapter:last-child{border-bottom:0}
.chapter .num{width:32px;height:32px;border-radius:8px;background:#eaf2ff;color:#2E86DE;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;margin-right:10px}
.chapter .mid{flex:1;min-width:0}
.chapter .t{font-size:14px;font-weight:600;margin-bottom:4px}
.chapter .b{font-size:12px;color:#999;display:flex;gap:8px}
.chapter .arrow{color:#ccc;font-size:16px;margin-left:6px}
.chapter .tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;background:#eaf2ff;color:#2E86DE;font-size:11px;padding:2px 8px;border-radius:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer;transition:.2s}
.seg button.on{background:#2E86DE;color:#fff;border-color:#2E86DE}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.btn-primary{background:#2E86DE;color:#fff}
.btn-ghost{background:#f0f0f0;color:#666}
.empty{text-align:center;padding:36px 20px;color:#999}
.empty .e{font-size:36px;margin-bottom:8px}
.bar{height:6px;background:#f0f0f0;border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2E86DE,#5aa8ff);border-radius:3px;transition:.3s}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gitem{text-align:center;cursor:pointer}
.gitem .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:20px}
.gitem .t{font-size:11px;color:#666}

/* 练习选项 & 解析 */
.opt{display:flex;align-items:center;gap:10px;border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.opt .l{background:#eaf2ff;color:#2E86DE;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700;flex-shrink:0}
.opt.right{border-color:#4CAF50;background:#f3fbf4}
.opt.right .l{background:#4CAF50;color:#fff}
.opt.wrong{border-color:#ef5350;background:#fdf3f3}
.opt.wrong .l{background:#ef5350;color:#fff}
.ex{padding:12px;border-radius:10px;margin-top:12px;font-size:13px;line-height:1.6}
.ex.ok{background:#e8f5e9;color:#2e7d32}
.ex.no{background:#ffebee;color:#c62828}

/* AI 答疑 */
.ai-page{display:flex;flex-direction:column;height:100vh;padding:0}
.ai-chat{flex:1;overflow-y:auto;padding:14px;background:#f5f7fa}
.msg{display:flex;margin-bottom:14px;align-items:flex-end;gap:8px}
.msg.user{justify-content:flex-end}
.msg .ava{width:30px;height:30px;border-radius:50%;background:#2E86DE;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.msg .bubble{max-width:78%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.65;word-break:break-word}
.msg.user .bubble{background:#2E86DE;color:#fff;border-bottom-right-radius:4px}
.msg.bot .bubble{background:#fff;color:#333;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ai-title{font-weight:700;color:#2E86DE;margin-bottom:4px}
.ai-formula{margin-top:8px;padding:8px 10px;background:#eaf2ff;border-radius:8px;color:#1a5fa8;font-weight:700;text-align:center}
.ai-tip{margin-top:8px;font-size:12px;color:#b26a00;background:#fff7e6;padding:8px 10px;border-radius:8px;line-height:1.5}
.ai-quick{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#fff;border-top:1px solid #eee}
.ai-quick .chip{flex-shrink:0;padding:6px 12px;background:#eaf2ff;color:#2E86DE;border-radius:16px;font-size:12px;white-space:nowrap;cursor:pointer}
.ai-input{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid #eee}
.ai-input input{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 14px;font-size:14px;outline:none}
.ai-input input:focus{border-color:#2E86DE}
.ai-input button{background:#2E86DE;color:#fff;border:0;border-radius:20px;padding:0 18px;font-size:14px;font-weight:600;cursor:pointer}

/* 底部 Tab */
.tabbar{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid #eee;display:flex;z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tab i{font-size:20px;color:#999;font-style:normal}
.tab .t{font-size:10px;color:#999}
.tab.on i,.tab.on .t{color:#2E86DE}
</style>
</head>
<body>
<div id="page-home" class="page"></div>
<div id="page-knowledge" class="page"></div>
<div id="page-chapter" class="page"></div>
<div id="page-practice" class="page"></div>
<div id="page-ai" class="page"></div>
<div id="page-profile" class="page"></div>
<div class="tabbar" id="tabbar"></div>
<script src="app.js"></script>
</body>
</html>
