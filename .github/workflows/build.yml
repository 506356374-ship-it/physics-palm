name: Build Physics App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Copy www to assets
        run: |
          if [ -d "www" ]; then
            mkdir -p app/src/main/assets/www
            cp -r www/* app/src/main/assets/www/
            echo "Copied www/ to assets/www/"
          fi
          ls -R app/src/main/assets 2>/dev/null || true

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH
          gradle -v

      - name: Clean bad init.gradle & Build Debug APK
        run: |
          # 彻底清理旧的错误 init.gradle，不再用镜像注入，避免 mavenCentral() 作用域报错
          rm -rf ~/.gradle/init.gradle ~/.gradle/caches/build-cache-1
          
          # 强制用系统 Gradle 8.5（绕过项目自带老 gradlew，防 JDK17 冲突）
          CMD="gradle"
          echo "Using: $CMD | Java: $(java -version 2>&1 | head -n 1)"
          
          # 如果项目根目录有 build.gradle，临时注入仓库（纯 URL 平级，无 mavenCentral() 简写坑）
          if [ -f "build.gradle" ]; then
            echo "Backing up build.gradle..."
            cp build.gradle build.gradle.bak
            # 在 allprojects 前插入仓库配置（用纯 URL，不调 mavenCentral() 方法）
            sed -i '1i allprojects { repositories { maven { url "https://maven.aliyun.com/repository/public" } maven { url "https://repo.maven.apache.org/maven2" } maven { url "https://dl.google.com/android/maven2" } } }' build.gradle
          fi
          
          set +e
          $CMD --stop 2>/dev/null || true
          $CMD clean assembleDebug --no-daemon --stacktrace
          BUILD_STATUS=$?
          set -e
          
          # 恢复原 build.gradle（不污染代码）
          if [ -f "build.gradle.bak" ]; then mv build.gradle.bak build.gradle; fi
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "BUILD FAILED with status $BUILD_STATUS"
            exit $BUILD_STATUS
          fi

      - name: Find and Upload APK
        run: |
          APK=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APK"
          mkdir -p /tmp/apk-out
          cp "$APK" /tmp/apk-out/physics-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: physics-web-apk
          path: /tmp/apk-out/physics-debug.apk
