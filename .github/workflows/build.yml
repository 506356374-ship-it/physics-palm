name: Build Physics App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Find gradlew or use Gradle
        run: |
          if [ -f "./gradlew" ]; then
            echo "Found gradlew at root"
            chmod +x ./gradlew
            echo "CMD=./gradlew" >> $GITHUB_ENV
          elif [ -f "./app/gradlew" ]; then
            echo "Found gradlew in app/"
            chmod +x ./app/gradlew
            echo "CMD=./app/gradlew" >> $GITHUB_ENV
          else
            echo "gradlew not found, using system gradle"
            echo "CMD=gradle" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: $CMD assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: physics-web-apk
          path: app/build/outputs/apk/debug/app-debug.apk
