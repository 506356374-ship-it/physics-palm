name: Build Physics App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Required for SDK & Gradle 8.7)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Gradle 8.7 (Override project's Gradle 9.x for old AGP compat)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH
          gradle -v

      - name: Copy www to assets
        run: |
          if [ -d "www" ]; then
            mkdir -p app/src/main/assets/www
            cp -r www/* app/src/main/assets/www/
            echo "Copied www/ to assets/www/"
          fi
          ls -R app/src/main/assets 2>/dev/null || true

      - name: Build Debug APK (Force Gradle 8.7, NO repo injection)
        run: |
          # 彻底清理旧注入，不写 init.gradle，不改 build.gradle，不用项目 gradlew(9.x)
          rm -rf ~/.gradle/init.gradle ~/.gradle/caches/build-cache-1
          if [ -f "build.gradle.bak" ]; then mv build.gradle.bak build.gradle; fi
          
          CMD="gradle"
          echo "Using: $CMD ($(gradle --version | grep Gradle)) | Java: $(java -version 2>&1 | head -n 1)"
          
          set +e
          $CMD --stop 2>/dev/null || true
          $CMD clean assembleDebug --no-daemon --stacktrace
          BUILD_STATUS=$?
          set -e
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "BUILD FAILED with status $BUILD_STATUS"
            exit $BUILD_STATUS
          fi

      - name: Find and Upload APK
        run: |
          APK=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APK"
          mkdir -p /tmp/apk-out
          cp "$APK" /tmp/apk-out/physics-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: physics-web-apk
          path: /tmp/apk-out/physics-debug.apk
