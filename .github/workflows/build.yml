name: Build Physics App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Copy www to assets (fix ERR_FILE_NOT_FOUND)
        run: |
          ASSETS_DIR=""
          if [ -d "app/src/main/assets" ]; then
            ASSETS_DIR="app/src/main/assets"
          elif [ -d "app/src/main" ]; then
            mkdir -p app/src/main/assets
            ASSETS_DIR="app/src/main/assets"
          fi
          if [ -d "www" ]; then
            mkdir -p $ASSETS_DIR/www
            cp -r www/* $ASSETS_DIR/www/ || true
            echo "Copied root www/ to $ASSETS_DIR/www/"
          elif [ -d "app/www" ]; then
            mkdir -p $ASSETS_DIR/www
            cp -r app/www/* $ASSETS_DIR/www/ || true
            echo "Copied app/www/ to $ASSETS_DIR/www/"
          else
            echo "Warning: no www/ found, asset loading may still fail on device"
          fi
          ls -R $ASSETS_DIR 2>/dev/null || true

      - name: Find gradlew or use Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "CMD=./gradlew" >> $GITHUB_ENV
          elif [ -f "./app/gradlew" ]; then
            chmod +x ./app/gradlew
            echo "CMD=./app/gradlew" >> $GITHUB_ENV
          else
            echo "CMD=gradle" >> $GITHUB_ENV
          fi

      - name: Build Debug APK (with mirror & verbose)
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { repositories { maven { url 'https://maven.aliyun.com/repository/public' } mavenCentral() google() } }" >> ~/.gradle/init.gradle
          set +e
          for i in 1 2 3; do
            $CMD assembleDebug --stacktrace --info
            if [ $? -eq 0 ]; then break; fi
            echo "Build attempt $i failed, retrying in 15s..."
            sleep 15
          done
          set -e

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found! Listing build dirs:"
            find . -path "*build/outputs/apk*" -type f 2>/dev/null || true
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: physics-web-apk
          path: ${{ steps.locate.outputs.apk_path }}
