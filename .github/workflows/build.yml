name: Build Physics App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Copy www to assets
        run: |
          if [ -d "www" ]; then
            mkdir -p app/src/main/assets/www
            cp -r www/* app/src/main/assets/www/
            echo "Copied www/ to assets/www/"
          fi
          ls -R app/src/main/assets 2>/dev/null || true

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          rm -rf ~/.gradle/init.gradle
          mkdir -p ~/.gradle
          echo 'allprojects { repositories { maven { url "https://maven.aliyun.com/repository/public" } mavenCentral() google() } }' >> ~/.gradle/init.gradle
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find and Upload APK
        run: |
          APK=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APK"
          mkdir -p /tmp/apk-out
          cp "$APK" /tmp/apk-out/physics-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: physics-web-apk
          path: /tmp/apk-out/physics-debug.apk
